name: CI

# event that triggers the action
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # configuration of the virtual environment that runs the workflow
  build:
    # X different builds for the X-numbered os's
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        node-version: [20.x]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: emergency_db
      MYSQL_USERNAME: ${{ secrets.CI_MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}

    # workflow
    steps:
      # specific pre-defined actions (already defined in other gitHub repositories)
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # commands that need to be run
      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: npm run db:init

      - name: Run tests
        run: npm run backend:test
